<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keuanganku (Firebase)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#f2f4ef;--card:#fff;--ink:#1c2a28;--mute:#6b7a76;--line:#dde3dc;--in:#1d7a58;--out:#b5472f;--acc:#1c2a28;--accfg:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121917;--card:#1a2421;--ink:#e8efec;--mute:#8fa09a;--line:#2b3834;--in:#4cc597;--out:#f0876d;--acc:#e8efec;--accfg:#121917;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121917;--card:#1a2421;--ink:#e8efec;--mute:#8fa09a;--line:#2b3834;--in:#4cc597;--out:#f0876d;--acc:#e8efec;--accfg:#121917;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
h1{font-size:20px;font-weight:800;margin:0}
select,input,button{font:inherit;color:inherit}
select,input{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
:focus-visible{outline:2px solid var(--in);outline-offset:2px}
.saldo{padding:22px 4px 18px}
.saldo small{color:var(--mute);font-size:14px}
.saldo b{display:block;font-size:clamp(34px,10vw,48px);font-weight:800;letter-spacing:-.02em;line-height:1.1}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.box small{color:var(--mute);display:block}
.box b{font-size:18px}
.in{color:var(--in)}.out{color:var(--out)}
form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;margin-bottom:22px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;padding:10px;cursor:pointer;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--acc);color:var(--accfg)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.add{border:0;background:var(--acc);color:var(--accfg);padding:12px;border-radius:10px;font-weight:700;cursor:pointer}
h2{font-size:15px;margin:22px 0 10px}
.bar{margin-bottom:10px;font-size:14px}
.bar div.t{height:6px;background:var(--line);border-radius:3px;margin-top:4px;overflow:hidden}
.bar div.t i{display:block;height:100%;background:var(--out);border-radius:3px}
.bar span{display:flex;justify-content:space-between}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
li .m{flex:1;min-width:0}
li .m b{display:block;font-weight:600}
li .m small{color:var(--mute)}
li .a{font-weight:700;white-space:nowrap}
li button{border:0;background:none;color:var(--mute);cursor:pointer;font-size:20px;padding:4px 8px}
.empty{color:var(--mute);padding:14px 0}
.tools{display:flex;gap:14px;margin-top:24px;font-size:13px}
.tools button{background:none;border:0;color:var(--mute);text-decoration:underline;cursor:pointer;padding:0}
#auth{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:10px;margin-top:40px}#auth p{margin:0;color:var(--mute);font-size:14px}#err{color:var(--out);min-height:1.2em}.alt{border:1px solid var(--line);background:transparent;padding:12px;border-radius:10px;cursor:pointer;font-weight:600}
</style>
</head>
<body>
<main>
<section id="auth" hidden>
  <h1>Masuk ke Keuanganku</h1>
  <p>Data tersimpan di akunmu sendiri dan sama di semua perangkat.</p>
  <input id="em" type="email" placeholder="Email" autocomplete="email" aria-label="Email">
  <input id="pw" type="password" placeholder="Kata sandi (min. 6 karakter)" autocomplete="current-password" aria-label="Kata sandi">
  <div id="err" role="alert"></div>
  <button class="add" id="bLogin" type="button">Masuk</button>
  <button class="alt" id="bDaftar" type="button">Buat akun baru</button>
</section>
<div id="app" hidden>
<header><h1>Keuanganku</h1><select id="bln" aria-label="Pilih bulan" style="width:auto"></select></header>

<section class="saldo"><small>Saldo bulan ini</small><b id="saldo">Rp0</b></section>
<div class="row2">
  <div class="box"><small>Pemasukan</small><b class="in" id="tin">Rp0</b></div>
  <div class="box"><small>Pengeluaran</small><b class="out" id="tout">Rp0</b></div>
</div>

<form id="f">
  <div class="seg" role="group" aria-label="Jenis">
    <button type="button" id="bOut" class="on">Pengeluaran</button>
    <button type="button" id="bIn">Pemasukan</button>
  </div>
  <div class="g2">
    <input id="amt" type="number" inputmode="numeric" min="1" placeholder="Jumlah (Rp)" required aria-label="Jumlah">
    <input id="tgl" type="date" required aria-label="Tanggal">
  </div>
  <div class="g2">
    <select id="kat" aria-label="Kategori"></select>
    <input id="note" placeholder="Catatan (opsional)" aria-label="Catatan">
  </div>
  <button class="add" type="submit">Simpan transaksi</button>
</form>

<h2>Pengeluaran per kategori</h2>
<div id="cat"></div>

<h2>Riwayat transaksi</h2>
<ul id="list"></ul>

<div class="tools"><button id="exp">Unduh cadangan</button><button id="clr">Hapus semua data</button><button id="out">Keluar</button></div>
</div>
</main>
<script type="module">
// 1. Isi konfigurasi dari Firebase Console (Project settings > Your apps > Web app)
const firebaseConfig = {
  apiKey: "AIzaSyBajjnYdL868-hsshSrn_ur5Nvd6MkcIDI",
  authDomain: "keuanganku-78121.firebaseapp.com",
  projectId: "keuanganku-78121",
  storageBucket: "keuanganku-78121.firebasestorage.app",
  messagingSenderId: "428307364856",
  appId: "1:428307364856:web:027e140feb65b6684ef40d",
  measurementId: "G-41X4Z43P53"
};
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,addDoc,deleteDoc,doc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

var $=function(i){return document.getElementById(i)};
var KO=["Makan","Transportasi","Belanja","Tagihan","Hiburan","Kesehatan","Lainnya"];
var KI=["Gaji","Usaha","Bonus","Lainnya"];
var data=[],tipe="out",uid=null,stop=null;

var configured=firebaseConfig.apiKey.indexOf("ISI_")!==0;
var auth,db;
if(configured){var app=initializeApp(firebaseConfig);auth=getAuth(app);db=getFirestore(app)}
else{$("auth").hidden=false;$("err").textContent="Konfigurasi Firebase belum diisi. Lihat bagian atas script."}

function rp(n){return "Rp"+Math.round(n).toLocaleString("id-ID")}
function ym(d){return d.slice(0,7)}
function col(){return collection(db,"users",uid,"transaksi")}

// 2. Login / daftar / keluar
function pesan(e){
  var m={"auth/invalid-credential":"Email atau kata sandi salah.","auth/email-already-in-use":"Email sudah terdaftar.","auth/weak-password":"Kata sandi minimal 6 karakter.","auth/invalid-email":"Format email tidak valid."};
  $("err").textContent=m[e.code]||"Gagal: "+e.code;
}
$("bLogin").onclick=function(){if(!configured)return;signInWithEmailAndPassword(auth,$("em").value,$("pw").value).catch(pesan)};
$("bDaftar").onclick=function(){if(!configured)return;createUserWithEmailAndPassword(auth,$("em").value,$("pw").value).catch(pesan)};
$("out").onclick=function(){signOut(auth)};

// 3. Saat status login berubah, mulai atau hentikan pemantauan data
if(configured)onAuthStateChanged(auth,function(user){
  if(stop){stop();stop=null}
  if(user){
    uid=user.uid;$("auth").hidden=true;$("app").hidden=false;
    // onSnapshot: dipanggil setiap data berubah, dari perangkat mana pun
    stop=onSnapshot(col(),function(snap){
      data=snap.docs.map(function(d){var x=d.data();x.id=d.id;return x});
      fillBln();render();
    });
  }else{uid=null;data=[];$("app").hidden=true;$("auth").hidden=false}
});

// 4. Tampilan (sama seperti versi sebelumnya)
function fillKat(){$("kat").innerHTML=(tipe==="out"?KO:KI).map(function(k){return "<option>"+k+"</option>"}).join("")}
function setTipe(t){tipe=t;$("bOut").className=t==="out"?"on":"";$("bIn").className=t==="in"?"on":"";fillKat()}
function fillBln(){
  var set={};set[ym(new Date().toISOString())]=1;
  data.forEach(function(x){set[ym(x.d)]=1});
  var cur=$("bln").value;
  var keys=Object.keys(set).sort().reverse();
  $("bln").innerHTML=keys.map(function(k){
    var d=new Date(k+"-01T00:00:00");
    return '<option value="'+k+'">'+d.toLocaleDateString("id-ID",{month:"long",year:"numeric"})+"</option>"}).join("");
  if(cur&&set[cur])$("bln").value=cur;
}
function render(){
  var m=$("bln").value;
  var rows=data.filter(function(x){return ym(x.d)===m}).sort(function(a,b){return b.d.localeCompare(a.d)||b.ts-a.ts});
  var ti=0,to=0,cat={};
  rows.forEach(function(x){if(x.t==="in")ti+=x.a;else{to+=x.a;cat[x.k]=(cat[x.k]||0)+x.a}});
  $("tin").textContent=rp(ti);$("tout").textContent=rp(to);
  var s=$("saldo");s.textContent=(ti-to<0?"-":"")+rp(Math.abs(ti-to));s.className=ti-to<0?"out":"";
  var ks=Object.keys(cat).sort(function(a,b){return cat[b]-cat[a]});
  $("cat").innerHTML=ks.length?ks.map(function(k){var p=cat[k]/to*100;
    return '<div class="bar"><span><span>'+k+"</span><span>"+rp(cat[k])+" ("+Math.round(p)+'%)</span></span><div class="t"><i style="width:'+p+'%"></i></div></div>'}).join(""):'<div class="empty">Belum ada pengeluaran bulan ini.</div>';
  $("list").innerHTML=rows.length?rows.map(function(x){
    var d=new Date(x.d+"T00:00:00").toLocaleDateString("id-ID",{day:"numeric",month:"short"});
    var n=(x.n||"").replace(/</g,"&lt;");
    return '<li><div class="m"><b>'+x.k+"</b><small>"+d+(n?" · "+n:"")+'</small></div><span class="a '+x.t+'">'+(x.t==="in"?"+":"-")+rp(x.a)+'</span><button data-id="'+x.id+'" aria-label="Hapus transaksi">×</button></li>'}).join(""):'<li class="empty">Belum ada transaksi. Catat yang pertama di atas.</li>';
}

// 5. Simpan dan hapus ke Firestore
$("bOut").onclick=function(){setTipe("out")};
$("bIn").onclick=function(){setTipe("in")};
$("bln").onchange=render;
$("f").onsubmit=function(e){
  e.preventDefault();
  var a=parseFloat($("amt").value);if(!(a>0))return;
  var tgl=$("tgl").value;
  addDoc(col(),{t:tipe,a:a,k:$("kat").value,d:tgl,n:$("note").value.trim(),ts:Date.now()});
  $("amt").value="";$("note").value="";$("bln").value=ym(tgl);
};
$("list").onclick=function(e){
  var id=e.target.getAttribute&&e.target.getAttribute("data-id");if(!id)return;
  deleteDoc(doc(db,"users",uid,"transaksi",id));
};
$("exp").onclick=function(){
  var csv="Tanggal,Jenis,Kategori,Jumlah,Catatan\n"+data.map(function(x){return [x.d,x.t==="in"?"Pemasukan":"Pengeluaran",x.k,x.a,'"'+(x.n||"").replace(/"/g,'""')+'"'].join(",")}).join("\n");
  var w=window.open("","_blank");if(w){w.document.write("<pre>"+csv.replace(/</g,"&lt;")+"</pre>")}
};
$("clr").onclick=function(){
  if(confirm("Hapus semua transaksi? Tindakan ini tidak bisa dibatalkan.")){data.forEach(function(x){deleteDoc(doc(db,"users",uid,"transaksi",x.id))})}
};
$("tgl").value=new Date().toISOString().slice(0,10);
fillKat();
</script>
</body>
</html>
